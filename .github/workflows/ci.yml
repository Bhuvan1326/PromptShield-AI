name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least-privilege: read-only access to repo contents, nothing else.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Secret scan (tracked files, redacted output)
        run: node scripts/secret-scan.mjs
      - name: Dependency audit (production deps, high+)
        run: npm audit --omit=dev --audit-level=high || echo "::warning::production audit has advisories — see docs"
      # No secrets are ever exposed: the suite runs fully deterministic and
      # all Gemini tests are mocked.
